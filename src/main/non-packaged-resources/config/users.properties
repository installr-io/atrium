##
## User database (username and password) for basic auth
##

## Passwords are hashed with md5. To generate a password hash for user 'joe' with the 'password' 'f00b4r' use:
## `echo -n "joe:atrium:f00b4r" | md5sum`. The part in the middle (atrium) represents the realm for basic auth.
## More information can be found at `https://quarkus.io/version/3.27/guides/security-properties`
